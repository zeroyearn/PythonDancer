name: Release PythonDancer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false
        default: "v2.8.0"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - name: Resolve release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then TAG="${INPUT_TAG}"
          else TAG="v2.8.0"; fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 2
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "needed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          fi

  macos:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Install FFmpeg
        shell: bash
        run: |
          brew install ffmpeg
          ffmpeg -version | head -n 1
      - name: Install Intel scientific compatibility wheels
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            python -m pip install --only-binary=:all: "numba==0.61.2" "llvmlite==0.44.0"
          fi
      - name: Install
        run: python -m pip install -e '.[build,test,intiface,live]'
      - name: Compile and test
        shell: bash
        run: |
          python -m compileall -q dancer tests macos_entry.py
          python -m pytest
      - name: Package macOS app
        shell: bash
        run: bash scripts/build_macos.sh "${{ needs.preflight.outputs.version }}" "${{ matrix.arch }}"
      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            PythonDancer-${{ needs.preflight.outputs.version }}-macOS-${{ matrix.arch }}.zip
            PythonDancer-${{ needs.preflight.outputs.version }}-macOS-${{ matrix.arch }}.dmg
            PythonDancer-${{ needs.preflight.outputs.version }}-macOS-${{ matrix.arch }}.sha256

  windows:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[build,test,intiface,live]'
      - name: Compile and test
        shell: pwsh
        run: |
          python -m compileall -q dancer tests
          python -m pytest
      - name: Build Windows package
        shell: pwsh
        run: |
          python builder.py
          if (-not (Test-Path "dist/PythonDancer.exe")) { throw "PythonDancer.exe missing" }
          $help = & "dist/PythonDancer.exe" --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Frozen PythonDancer.exe --help failed" }
          if ($help -notmatch "live-prediction-ms") { throw "PythonDancer 2.8 Live CLI missing from frozen executable" }
          $version = "${{ needs.preflight.outputs.version }}"
          $archive = "PythonDancer-$version-Windows-x86_64.zip"
          Compress-Archive -Path "dist/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "PythonDancer-$version-Windows-x86_64.sha256"
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          if-no-files-found: error
          path: |
            PythonDancer-${{ needs.preflight.outputs.version }}-Windows-x86_64.zip
            PythonDancer-${{ needs.preflight.outputs.version }}-Windows-x86_64.sha256

  publish:
    needs: [preflight, macos, windows]
    if: needs.preflight.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## PythonDancer 2.8.0 — AI Choreography DAW / AI 六轴编舞工作站

          PythonDancer 2.8 turns the 2.7 Quality Intelligence workstation into a DAW-style choreography environment while preserving the validated six-axis, project, safety and bilingual workflows.

          ### DAW editing
          - timeline Automation Lanes for energy, stroke depth, rotation mix, gesture density, smoothing, complexity and safety aggressiveness;
          - Style Morphing keyframes interpolate continuous Motion Intent and movement strength through the song;
          - manual Candidate Composer assigns different generated candidates to individual sections and blends their raw editable plans;
          - existing waveform/beat grid, Gesture Timeline, curve editor, Solo/Mute/Lock, local regeneration, A/B and Auto Improvement remain part of one non-destructive output chain;
          - default DAW state is a strict identity transform, so opening a 2.7 project does not silently change its motion.

          ### Live Choreography
          - optional sounddevice capture for microphone/system-routed audio inputs;
          - streaming spectral features, predictive beat scheduling and bounded six-axis Live motion;
          - configurable BPM and prediction horizon;
          - preview-only Live mode or direct TCode serial output;
          - Live output passes through Device Twin mechanical safe-pose projection and calibration before hardware commands.

          ### Device Twin
          - one portable profile combines SR6 geometry, per-axis calibration, velocity/acceleration/jerk limits, transport timing and mechanical-risk policy;
          - Device Twin safe mode feeds both offline final constraints and Live per-frame safety;
          - firmware remains responsible for final device-specific PWM/servo behavior and emergency safety.

          ### Project / CLI / localization
          - `.pdance` schema 4 persists Automation, Style Morph, Candidate Composer, Device Twin and Live settings; schemas 1/2/3 remain readable;
          - CLI supports Automation/Style/Composer/Device Twin JSON plus predictive `--live` mode;
          - Simplified Chinese and English cover the new DAW and Live surfaces while engine tokens and TCode values remain untranslated.

          ### Packages
          - Windows x86_64;
          - native macOS arm64;
          - native macOS Intel x86_64;
          - FFmpeg bundled on macOS; Intiface and Live audio dependencies included in desktop packages; Demucs remains optional/external.

          ### macOS note
          macOS bundles are ad-hoc signed but are not Apple-notarized. On first launch macOS may require Control-click/right-click → Open. Live audio capture requires microphone/audio-input permission when Live mode is started.
          EOF
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          find release-assets -maxdepth 1 -type f -print | sort
          gh release create "${TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "PythonDancer ${VERSION}" \
            --notes-file RELEASE_NOTES.md