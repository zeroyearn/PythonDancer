name: Release PythonDancer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false
        default: "v3.0.0"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - name: Resolve release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then TAG="${INPUT_TAG}"
          else TAG="v3.0.0"; fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 2
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "needed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          fi

  macos:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Install FFmpeg
        shell: bash
        run: |
          brew install ffmpeg
          ffmpeg -version | head -n 1
      - name: Install Intel scientific compatibility wheels
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            python -m pip install --only-binary=:all: "numba==0.61.2" "llvmlite==0.44.0"
          fi
      - name: Install
        run: python -m pip install -e '.[build,test,intiface,live,control]'
      - name: Compile and test
        shell: bash
        run: |
          python -m compileall -q dancer tests macos_entry.py
          python -m pytest
      - name: Package macOS app
        shell: bash
        run: bash scripts/build_macos.sh "${{ needs.preflight.outputs.version }}" "${{ matrix.arch }}"
      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            PythonDancer-${{ needs.preflight.outputs.version }}-macOS-${{ matrix.arch }}.zip
            PythonDancer-${{ needs.preflight.outputs.version }}-macOS-${{ matrix.arch }}.dmg
            PythonDancer-${{ needs.preflight.outputs.version }}-macOS-${{ matrix.arch }}.sha256

  windows:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[build,test,intiface,live,control]'
      - name: Compile and test
        shell: pwsh
        run: |
          python -m compileall -q dancer tests
          python -m pytest
      - name: Build Windows package
        shell: pwsh
        run: |
          python builder.py
          if (-not (Test-Path "dist/PythonDancer.exe")) { throw "PythonDancer.exe missing" }
          $help = & "dist/PythonDancer.exe" --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Frozen PythonDancer.exe --help failed" }
          if ($help -notmatch "live-prediction-ms") { throw "Live CLI missing from frozen executable" }
          if ($help -notmatch "copilot") { throw "PythonDancer 3.0 Copilot missing from frozen executable" }
          if ($help -notmatch "motion-program") { throw "Motion Grammar CLI missing from frozen executable" }
          if ($help -notmatch "reference-index") { throw "Reference Retrieval CLI missing from frozen executable" }
          $version = "${{ needs.preflight.outputs.version }}"
          $archive = "PythonDancer-$version-Windows-x86_64.zip"
          Compress-Archive -Path "dist/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "PythonDancer-$version-Windows-x86_64.sha256"
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          if-no-files-found: error
          path: |
            PythonDancer-${{ needs.preflight.outputs.version }}-Windows-x86_64.zip
            PythonDancer-${{ needs.preflight.outputs.version }}-Windows-x86_64.sha256

  publish:
    needs: [preflight, macos, windows]
    if: needs.preflight.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## PythonDancer 3.0.0 — Intelligent Choreography / 智能六轴编舞

          PythonDancer 3.0 adds a semantic intelligence layer above the validated 2.8 DAW. New intelligence features remain opt-in and canonical motion still passes through the existing optimizer, mechanical projection and Device Twin safety chain.

          ### Choreography intelligence
          - Choreography Copilot compiles Chinese/English natural-language edits into deterministic DAW and Motion Grammar operations instead of raw hardware commands;
          - Motion Grammar / Motion Compiler adds reusable semantic primitives such as wave, spiral, orbit, pulse, sweep, twist, accent and recoil;
          - Preference Learning records explicit candidate A/B choices and adapts the existing Quality Intelligence weights locally;
          - section-level Reference Retrieval ranks reusable motion sections and can adapt duration/amplitude before safe section splicing.

          ### Integration and ecosystem
          - Plugin SDK discovers gestures, quality metrics, devices, exporters, analyzers, planners, Copilot backends and control surfaces through `pythondancer.plugins` entry points;
          - optional MIDI and OSC control surfaces plus a Link-style BPM/beat-phase transport interface can drive Live Choreography;
          - portable `.pdmotion` Motion Packs bundle Motion Grammar, DAW presets, Device Twins and preference profiles;
          - Batch Queue supports multi-file generation workflows;
          - Project Version Graph adds choreography snapshots, branches, checkout and section-level merging.

          ### Device Twin 2.0
          - hardware-in-the-loop telemetry can estimate command gain/bias, response latency and RMS tracking error;
          - feedback compensation remains optional and is applied before calibrated device output;
          - dynamic load simulation estimates sustained motion load, reversal density and a conservative thermal model;
          - physical output still remains TCode/Intiface and firmware retains final PWM/servo/emergency-safety authority.

          ### Project / CLI / GUI
          - `.pdance` schema 5 persists the 3.0 intelligence state while schemas 1/2/3/4 remain readable;
          - new Intelligence workspace exposes Copilot, Preference Learning, Motion Grammar, Reference Retrieval, Versions, Motion Packs, Plugin SDK, telemetry, control surfaces and Batch Queue;
          - CLI exposes Copilot, motion-program, preference, retrieval, telemetry, plugin, Motion Pack, versioning and batch controls;
          - Simplified Chinese / English localization covers the new 3.0 surfaces.

          ### Packages
          - Windows x86_64;
          - native macOS arm64;
          - native macOS Intel x86_64;
          - desktop packages include Intiface, Live audio, MIDI and OSC dependencies; FFmpeg is bundled on macOS; Demucs remains optional/external.

          ### macOS note
          macOS bundles are ad-hoc signed and are not Apple-notarized. On first launch macOS may require Control-click/right-click → Open. Audio input and local-network permissions are only needed when their corresponding Live/control features are enabled.
          EOF
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          find release-assets -maxdepth 1 -type f -print | sort
          gh release create "${TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "PythonDancer ${VERSION}" \
            --notes-file RELEASE_NOTES.md
