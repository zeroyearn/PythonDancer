name: Release PythonDancer

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false
        default: "v2.6.0"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - name: Resolve release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then TAG="${INPUT_TAG}"
          else TAG="v2.6.0"; fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "needed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          fi

  macos:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Install FFmpeg
        shell: bash
        run: |
          brew install ffmpeg
          ffmpeg -version | head -n 1
      - name: Install Intel scientific compatibility wheels
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            python -m pip install --only-binary=:all: "numba==0.61.2" "llvmlite==0.44.0"
          fi
      - name: Install
        run: python -m pip install -e '.[build,test,intiface]'
      - name: Compile and test
        shell: bash
        run: |
          python -m compileall -q dancer tests macos_entry.py
          python -m pytest
      - name: Package macOS app
        shell: bash
        run: bash scripts/build_macos.sh "${{ needs.preflight.outputs.version }}" "${{ matrix.arch }}"
      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            PythonDancer-${{ needs.preflight.outputs.version }}-macOS-${{ matrix.arch }}.zip
            PythonDancer-${{ needs.preflight.outputs.version }}-macOS-${{ matrix.arch }}.dmg
            PythonDancer-${{ needs.preflight.outputs.version }}-macOS-${{ matrix.arch }}.sha256

  windows:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[build,test,intiface]'
      - name: Compile and test
        shell: pwsh
        run: |
          python -m compileall -q dancer tests
          python -m pytest
      - name: Build Windows package
        shell: pwsh
        run: |
          python builder.py
          if (-not (Test-Path "dist/PythonDancer.exe")) { throw "PythonDancer.exe missing" }
          $version = "${{ needs.preflight.outputs.version }}"
          $archive = "PythonDancer-$version-Windows-x86_64.zip"
          Compress-Archive -Path "dist/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "PythonDancer-$version-Windows-x86_64.sha256"
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          if-no-files-found: error
          path: |
            PythonDancer-${{ needs.preflight.outputs.version }}-Windows-x86_64.zip
            PythonDancer-${{ needs.preflight.outputs.version }}-Windows-x86_64.sha256

  publish:
    needs: [preflight, macos, windows]
    if: needs.preflight.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## PythonDancer 2.6.0 — Generation Quality

          2.6 upgrades the six-axis generator from a shared-timeline procedural engine into a source-aware, intent-driven multi-axis planner.

          ### Generation quality
          - independent L1/L2/R0/R1/R2 musical event timelines;
          - continuous Motion Intent: intensity, aggression, flow, complexity, symmetry, rotation bias, translation bias, accent density;
          - richer optional stem features for drums/kick/snare/hi-hat, bass, vocals and other;
          - multi-reference style blending and deterministic style clustering;
          - advanced Gesture Timeline blocks with per-axis mix, phase, cycles, direction and blend envelopes;
          - cross-axis 6D pose and simultaneous velocity optimization;
          - per-axis jerk limits in addition to speed and acceleration limits.

          ### Device adaptation
          - reusable device calibration profiles with safe ranges, neutral, inversion and kinematic limits;
          - conservative one-axis-at-a-time calibration verification sequence;
          - transport/device latency compensation and optional serial RTT measurement;
          - calibrated live TCode and Intiface playback while exported scripts stay canonical;
          - existing Soft Start, Auto Home, D2 mapping, DSTOP, Pause/Resume/Seek and exception-safe serial shutdown remain intact.

          ### Workstation
          - Generation Quality controls and live Motion Intent readout;
          - advanced gesture controls in the workstation;
          - `.pdance` schema 2 stores advanced gesture state while schema 1 remains readable;
          - Windows x86_64 and native macOS arm64 / Intel x86_64 desktop packages.

          ### macOS note
          macOS bundles are ad-hoc signed but are not Apple-notarized. On first launch macOS may require Control-click/right-click → Open. FFmpeg is bundled.

          Demucs remains optional/external; existing separated stem folders can be selected directly.
          EOF
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          find release-assets -maxdepth 1 -type f -print | sort
          gh release create "${TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "PythonDancer ${VERSION}" \
            --notes-file RELEASE_NOTES.md
