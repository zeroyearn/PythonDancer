name: macOS build

on:
  push:
    branches: ["master", "feat/**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  macos-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve package version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test -n "${VERSION}"
          echo "PYTHON_DANCER_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "PythonDancer version: ${VERSION}"

      - name: Verify runner architecture
        shell: bash
        run: |
          echo "runner=$(uname -m) expected=${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Install FFmpeg
        shell: bash
        run: |
          brew install ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Intel scientific compatibility wheels
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            python -m pip install --only-binary=:all: "numba==0.61.2" "llvmlite==0.44.0"
          else
            echo "Apple Silicon uses current numba/llvmlite wheels."
          fi

      - name: Install Python dependencies
        run: python -m pip install -e '.[build,test,intiface]'

      - name: Compile
        run: python -m compileall -q dancer tests macos_entry.py

      - name: Test
        run: python -m pytest

      - name: Build macOS app
        shell: bash
        run: bash scripts/build_macos.sh "${PYTHON_DANCER_VERSION}" "${{ matrix.arch }}"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PythonDancer-${{ env.PYTHON_DANCER_VERSION }}-macOS-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            PythonDancer-${{ env.PYTHON_DANCER_VERSION }}-macOS-${{ matrix.arch }}.zip
            PythonDancer-${{ env.PYTHON_DANCER_VERSION }}-macOS-${{ matrix.arch }}.dmg
            PythonDancer-${{ env.PYTHON_DANCER_VERSION }}-macOS-${{ matrix.arch }}.sha256
