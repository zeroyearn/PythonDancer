name: Test and Windows build

on:
  push:
    branches: ["master", "feat/**"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test,intiface,live,control]'
      - name: Compile
        run: python -m compileall -q dancer tests
      - name: Test
        run: python -m pytest

  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[build,intiface,live,control]'
      - name: Build executable
        run: python builder.py
      - name: Smoke-test frozen executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\PythonDancer.exe"
          if (-not (Test-Path $exe)) { throw "Frozen executable not found: $exe" }
          $help = & $exe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Frozen executable --help failed with exit code $LASTEXITCODE" }
          if ($help -notmatch "six-axis choreography") { throw "Frozen help output did not contain expected CLI text" }
          if ($help -notmatch "live-prediction-ms") { throw "Frozen help output did not expose Live CLI" }
          if ($help -notmatch "copilot") { throw "Frozen help output did not expose PythonDancer 3.0 Copilot" }
          if ($help -notmatch "motion-program") { throw "Frozen help output did not expose Motion Grammar CLI" }
          if ($help -notmatch "reference-index") { throw "Frozen help output did not expose Reference Retrieval CLI" }
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PythonDancer-windows
          path: |
            dist
            !dist/**/*.md
