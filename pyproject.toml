[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-dancer"
version = "2.0.0"
description = "Beat-aware audio-to-funscript motion generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.11,<2",
  "librosa>=0.10.2,<0.12",
  "matplotlib>=3.7,<4",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7", "requests>=2.31,<3"]
test = ["pytest>=8,<9"]

[project.scripts]
python-dancer = "dancer:main"

[tool.setuptools.packages.find]
include = ["dancer*"]
exclude = ["dancer.dancer.egg-info*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
