[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-dancer"
version = "3.0.0"
description = "Intelligent six-axis choreography workstation with Copilot, Motion Grammar, preference learning, retrieval, Device Twin 2.0, Live control surfaces, TCode and Intiface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.11,<2",
  "librosa>=0.10.2,<0.12",
  "matplotlib>=3.7,<4",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
intiface = ["buttplug>=1.0,<2"]
live = ["sounddevice>=0.5,<1"]
control = ["mido>=1.3,<2", "python-osc>=1.9,<2"]
build = ["pyinstaller>=6,<7", "requests>=2.31,<3"]
test = ["pytest>=8,<9"]

[project.scripts]
python-dancer = "dancer:main"

[tool.setuptools.packages.find]
include = ["dancer*"]
exclude = ["dancer.dancer.egg-info*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
